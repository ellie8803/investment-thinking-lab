name: Update Market Data

on:
  workflow_dispatch:
  schedule:
    - cron: '15 1 * * *'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Fetch FRED data
        run: |
          python - <<'PY'
          import csv, io, json, urllib.request
          from datetime import datetime, timezone
          from pathlib import Path

          series = ['VIXCLS', 'BAMLH0A0HYM2', 'DGS2', 'DGS10', 'DFII10', 'M2SL', 'WALCL']
          result = {'updated_at': datetime.now(timezone.utc).isoformat(), 'source': 'FRED', 'indicators': {}}
          for sid in series:
              url = f'https://fred.stlouisfed.org/graph/fredgraph.csv?id={sid}'
              try:
                  request = urllib.request.Request(url, headers={'User-Agent': 'InvestmentThinkingLab/1.0'})
                  with urllib.request.urlopen(request, timeout=30) as response:
                      content = response.read().decode('utf-8-sig')
                  reader = csv.DictReader(io.StringIO(content))
                  points = []
                  for row in reader:
                      try:
                          value = float(row[sid])
                          date = row.get('DATE') or row.get('observation_date')
                          if date:
                              points.append({'date': date, 'value': value})
                      except (ValueError, TypeError, KeyError):
                          continue
                  if not points:
                      raise ValueError('No valid observations')
                  result['indicators'][sid] = points[-120:]
                  print(f'{sid}: {len(points)} observations')
              except Exception as exc:
                  print(f'{sid}: ERROR {exc}')
                  result['indicators'][sid] = []
          Path('market-data.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          PY

      - name: Commit updated data
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add market-data.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update market data'
            git push
          fi
