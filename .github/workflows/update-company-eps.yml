name: Update Company EPS
on:
  workflow_dispatch:
  schedule:
    - cron: '35 3 * * 2,5'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Fetch SEC companyfacts EPS
        env:
          SEC_CONTACT_EMAIL: ${{ vars.SEC_CONTACT_EMAIL }}
        run: python scripts/update_company_eps.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add company-eps.json
          if ! git diff --cached --quiet; then
            git commit -m "Update SEC EPS data"
            git push
          fi
